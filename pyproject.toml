[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netgraph-toolkit"
version = "0.1.0"
description = "A dependency-free command-line toolkit for complex network analysis: metrics, random graph models, and community detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ruizhao Zheng" },
]
keywords = ["complex networks", "graph theory", "network science", "community detection", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.scripts]
netgraph = "netgraph.cli:main"

[project.urls]
Homepage = "https://github.com/zhengas2o3/netgraph-toolkit"

[tool.setuptools]
packages = ["netgraph"]
